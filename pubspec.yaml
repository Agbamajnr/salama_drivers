name: salama_users
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.2.0+2

environment:
  sdk: ^3.6.0-216.1.beta

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  dio: ^5.7.0
  logger: ^2.4.0
  flutter_secure_storage: ^9.2.2
  get_it: ^8.0.0
  provider: ^6.1.2
  injectable: ^2.4.1
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  top_snackbar_flutter: ^3.1.0
  camera: ^0.11.0+2
  internet_connection_checker: ^1.0.0+1
  flutter_dotenv: ^5.1.0
  rxdart: ^0.27.7
  flutter_spinkit: ^5.2.1
  another_flushbar: ^1.12.30
  intl: ^0.19.0
  slidable_button: ^3.0.0+1
  action_slider: ^0.7.0
  geolocator: ^13.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  webview_flutter: ^4.10.0
  flutter_platform_alert: ^0.6.1
  change_app_package_name: ^1.4.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.3
  flutter_launcher_icons: ^0.14.1
  icons_launcher: ^3.0.0
  easy_url_launcher: ^0.0.7
  vibration: ^2.0.1
  audioplayers: ^6.1.0
  google_maps_flutter: ^2.2.0
  url_launcher: ^6.1.11
  # flutter_local_notifications: ^16.3.2
  # firebase_messaging: ^11.4.3

dev_dependencies:
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1
  json_serializable: ^6.8.0

dependency_overrides:
  firebase_core_platform_interface: ^5.0.0
  firebase_messaging_platform_interface: ^4.5.24

#flutter_launcher_icons:
#  android: "launcher_icon"
#  ios: true
#  image_path: "assets/icons/launcher_icon.png"
##  adaptive_icon_background: "#ffffff"
##  adaptive_icon_foreground:
#  min_sdk_android: 21
#  remove_alpha_ios: true
icons_launcher:
  image_path: "assets/icons/launcher_icon.jpeg"
  adaptive_background_color: "#fffff"
  platforms:
    android:
      enable: true
    ios:
      enable: true

  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/icons/
    - assets/sounds/
    - assets/sounds/sample_ringtone.mp3
    - .env
    - .env.staging

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
